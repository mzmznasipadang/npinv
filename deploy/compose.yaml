# Lives at /srv/npinv/compose.yaml on naspad-server. Copied there by deploy/deploy.sh.
name: npinv

services:
  npinv:
    build: ./src
    image: npinv:latest
    container_name: npinv
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # Docker-published ports bypass ufw, so bind to localhost only.
      # Reached through `tailscale serve` on HTTPS port 8445.
      - "127.0.0.1:3003:3000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    mem_limit: 512m
